# Pushed to remote hosts on ssh connect (see ~/.ssh/config.d/home-network).
# Keep this minimal — it's a landing pad for remote boxes, not your daily driver.

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-style bg=black,fg=white
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=cyan]%H:%M"
