add_newline = false

format = """
$username\
$hostname\
$directory\
$kubernetes\
$status\
$character"""

right_format = """
$cmd_duration\
$git_state\
$git_branch\
$git_status"""

[username]
show_always = false
format = "[$user]($style) "

[hostname]
disabled = false
ssh_only = true
format = "@ [$hostname]($style) "
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[✗](red)"

[directory]
style = "blue"
truncation_length = 5
truncate_to_repo = true
truncation_symbol = "../"
read_only = " "

[status]
disabled = false
format = "[$status]($style) "
style = "bold red"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

[git_branch]
format = "[$branch]($style) "
style = "yellow"

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style) "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = "≡"
